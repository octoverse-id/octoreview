[project]
name = "octoreview"
version = "0.0.0"
description = "Multi-tenant review and rating service with configurable media storage."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2.8,<5.3",
  "djangorestframework>=3.18.2,<3.19",
  "drf-spectacular>=0.27,<0.31",
  "psycopg[binary]>=3.2,<3.4",
  "dj-database-url>=2.2,<4.0",
  "django-cors-headers>=4.4,<5.0",
  "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35,<2.0"]
dev = [
  "import-linter>=2.1,<3.0",
  "openapi-spec-validator>=0.7,<0.9",
  "pip-audit>=2.7,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "pytest-django>=4.9,<5.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.8,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_pytest"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --cov=octoreview --cov-report=term-missing:skip-covered"
filterwarnings = [
  # LIMIT/OFFSET over a query with no ORDER BY is undefined in SQL; make it a test failure
  # (octonomy issue #162).
  "error::django.core.paginator.UnorderedObjectListWarning",
]

[tool.coverage.run]
source = ["octoreview"]
omit = ["*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B904"]

[tool.importlinter]
root_package = "octoreview"

# docs/spec.md section 13. Bottom-to-top layers: a module may import only layers below it.
[[tool.importlinter.contracts]]
name = "Domain layers"
type = "layers"
layers = [
  "octoreview.openapi",
  "octoreview.api",
  "octoreview.lifecycle",
  "octoreview.media",
  "octoreview.reviews",
  "octoreview.entities",
  "octoreview.service_auth",
  "octoreview.audit | octoreview.events",
  "octoreview.core",
]

[[tool.importlinter.contracts]]
name = "Storage adapters stay inside octoreview.media"
type = "forbidden"
source_modules = [
  "octoreview.api",
  "octoreview.lifecycle",
  "octoreview.reviews",
  "octoreview.entities",
]
forbidden_modules = ["octoreview.media.storage"]
allow_indirect_imports = true
