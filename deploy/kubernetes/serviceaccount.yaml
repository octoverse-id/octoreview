# S3 credentials come from the boto3 default chain. On EKS, IRSA binds this ServiceAccount to an
# IAM role with the policy in docs/storage.md; the pods set automountServiceAccountToken: false,
# which only drops the Kubernetes API token: the IRSA webhook projects its own token. Elsewhere,
# drop the annotation and use the platform's workload identity or keys in the Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: octoreview
  namespace: octoreview
  labels:
    app.kubernetes.io/name: octoreview
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/octoreview-media"
automountServiceAccountToken: false
