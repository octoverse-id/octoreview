# A template: never commit real values. Create the real Secret from a secret manager, or with
#   kubectl -n octoreview create secret generic octoreview-secrets --from-env-file=secrets.env
# Generate each key with: python -c "import secrets; print(secrets.token_urlsafe(48))"
# OCTOREVIEW_ERASURE_HMAC_KEY never rotates (docs/operations.md "Rotating secrets").
apiVersion: v1
kind: Secret
metadata:
  name: octoreview-secrets
  namespace: octoreview
  labels:
    app.kubernetes.io/name: octoreview
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "CHANGE_ME"
  OCTOREVIEW_SERVICE_TOKEN_PEPPER: "CHANGE_ME"
  OCTOREVIEW_ERASURE_HMAC_KEY: "CHANGE_ME"
  OCTOREVIEW_WEBHOOK_SECRET: "CHANGE_ME"
  DATABASE_URL: "postgres://octoreview:CHANGE_ME@postgres.example.internal:5432/octoreview"
