# Deletes abandoned uploads, the media of removed reviews and erased authors' media; a failed
# key fails the Job (cleanup_media.failed alerts).
# concurrencyPolicy Forbid: a slow run is never overlapped by the next one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: octoreview-cleanup-media
  namespace: octoreview
  labels:
    app.kubernetes.io/name: octoreview
    app.kubernetes.io/component: cleanup-media
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: octoreview
            app.kubernetes.io/component: cleanup-media
        spec:
          restartPolicy: Never
          serviceAccountName: octoreview
          # octoreview never calls the Kubernetes API; a mounted API token would turn an app-level
          # RCE into cluster access (IRSA projects its own token regardless).
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup-media
              image: ghcr.io/octoverse-id/octoreview:1.0.0-rc.4
              # `args`, not `command`: the image entrypoint still runs `manage.py check` first.
              args: ["python", "manage.py", "cleanup_media"]
              envFrom:
                - configMapRef:
                    name: octoreview-config
                - secretRef:
                    name: octoreview-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
