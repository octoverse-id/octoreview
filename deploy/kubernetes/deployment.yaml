# The API (gunicorn, gthread). Stateless: state lives in PostgreSQL and the bucket, so it scales
# out. Probes use the unauthenticated health endpoints; readiness checks the database, never
# storage. Static files (the optional admin console) are baked into the image and served by the
# app, so nothing mounts over /app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octoreview
  namespace: octoreview
  labels:
    app.kubernetes.io/name: octoreview
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: octoreview
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octoreview
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: octoreview
      # octoreview never calls the Kubernetes API; a mounted API token would turn an app-level
      # RCE into cluster access (IRSA projects its own token regardless).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # gunicorn.conf.py sets graceful_timeout=25, inside this window.
      terminationGracePeriodSeconds: 30
      containers:
        - name: octoreview
          image: ghcr.io/octoverse-id/octoreview:1.0.0-rc.1
          ports:
            - name: http
              containerPort: 8000
          # DJANGO_ALLOWED_HOSTS must accept the Host the probes send (DEBUG off rejects the
          # pod IP the kubelet would send by default).
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          envFrom:
            - configMapRef:
                name: octoreview-config
            - secretRef:
                name: octoreview-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
