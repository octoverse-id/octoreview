# Drops delivered and old dead-letter outbox events.
# concurrencyPolicy Forbid: a slow run is never overlapped by the next one.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: octoreview-prune-outbox
  namespace: octoreview
  labels:
    app.kubernetes.io/name: octoreview
    app.kubernetes.io/component: prune-outbox
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: octoreview
            app.kubernetes.io/component: prune-outbox
        spec:
          restartPolicy: Never
          serviceAccountName: octoreview
          # octoreview never calls the Kubernetes API; a mounted API token would turn an app-level
          # RCE into cluster access (IRSA projects its own token regardless).
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune-outbox
              image: ghcr.io/octoverse-id/octoreview:1.0.0
              # `args`, not `command`: the image entrypoint still runs `manage.py check` first.
              args: ["python", "manage.py", "prune_outbox_events"]
              envFrom:
                - configMapRef:
                    name: octoreview-config
                - secretRef:
                    name: octoreview-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
