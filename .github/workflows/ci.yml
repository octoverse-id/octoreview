name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job name below is a final required check in the `main: require PR + green CI` ruleset
# (.github/rulesets/main-require-pr-green-ci.json). Jobs marked octoreview:placeholder are
# bootstrap stand-ins that pass so the ruleset could be set once; each is replaced by the real
# job in its feature PR. `make release-check` fails while any placeholder remains.

jobs:
  lint:
    runs-on: ubuntu-latest
    # Explicit timeouts everywhere: the default is 360 minutes and every job here is required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        # Pinned actionlint via `go install` (checksum-verified by the Go module database).
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Check llms.txt links
        run: make llms-check
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff lint and format check
        run: make lint

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: Django checks, migration drift, import layers and grep gates
        run: make checks

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Audit locked dependencies
        run: make security

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: Run the suite on SQLite
        run: make test

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: octoreview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/octoreview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: Run the suite on PostgreSQL
        # Row-lock concurrency, varchar width and partial-index tests only run here.
        run: uv run pytest

  storage-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: S3 tests and check_storage against the emulator
        # Starts the digest-pinned RustFS image named by S3_IMAGE in the Makefile, then runs the
        # storage contract suite, the media API on s3 (with a 500 MiB completion) and
        # check_storage. Azurite and fake-gcs-server join this job in release line 2.
        run: make test-storage

  compose-quickstart:
    # octoreview:placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bootstrap placeholder
        run: echo "octoreview:placeholder - 'compose-quickstart' becomes a real job in its feature PR"

  docker:
    # octoreview:placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bootstrap placeholder
        run: echo "octoreview:placeholder - 'docker' becomes a real job in its feature PR"
