name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job name below is a final required check in the `main: require PR + green CI` ruleset
# (.github/rulesets/main-require-pr-green-ci.json). The bootstrap placeholder jobs that let the
# ruleset be set once have all been replaced; `make placeholder-check` (part of
# `make release-check`) fails if a job carrying the placeholder marker comes back.

jobs:
  lint:
    runs-on: ubuntu-latest
    # Explicit timeouts everywhere: the default is 360 minutes and every job here is required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        # Pinned actionlint via `go install` (checksum-verified by the Go module database).
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Check llms.txt links
        run: make llms-check
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff lint and format check
        run: make lint

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: Django checks, migration drift, import layers and grep gates
        run: make checks

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Audit locked dependencies
        run: make security

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: Run the suite on SQLite
        run: make test

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: octoreview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/octoreview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: Run the suite on PostgreSQL
        # Row-lock concurrency, varchar width and partial-index tests only run here.
        run: uv run pytest

  storage-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra s3
      - name: S3 tests and check_storage against the emulator
        # Starts the digest-pinned RustFS image named by S3_IMAGE in the Makefile, then runs the
        # storage contract suite, the media API on s3 (with a 500 MiB completion) and
        # check_storage. Azurite and fake-gcs-server join this job in release line 2.
        run: make test-storage

  compose-quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose quickstart (clean, second run, s3 profile)
        # docker compose up through the curl quickstart within 5 minutes per run; the image
        # build is timed separately. Each run's time goes to the job summary.
        run: make compose-quickstart

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job never holds a registry credential: ci.yml runs on pull_request, so a fork PR can
    # trigger it. Build and smoke only; publishing lives in its own workflow (copied from
    # octonomy's reasoning).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same pins as octonomy. The `type=gha` cache written here is restored by the publish
      # path, so these must not float (a hijacked mutable tag could poison shared layers).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: octoreview:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        # Non-root, s3 extra present, no dev tools, manage.py check, fail-closed startup,
        # live and ready health after migrate, gthread workers and an all-JSON log stream.
        run: make docker-smoke IMAGE=octoreview:ci
