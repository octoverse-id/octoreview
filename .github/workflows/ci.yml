      - name: Bootstrap placeholder
        run: echo "octoreview:placeholder - 'storage-emulators' becomes a real job in its feature PR"

  compose-quickstart:
    # octoreview:placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bootstrap placeholder
        run: echo "octoreview:placeholder - 'compose-quickstart' becomes a real job in its feature PR"

  docker:
